<!DOCTYPE html>
<html>
<head>
  <title>Falcon Transfer Mykonos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      background: black;
    }

    .wrapper {
      position: relative;
      max-width: 1200px;
      margin: auto;
    }

    .bg {
      width: 100%;
      display: block;
    }

    .btn {
      position: absolute;
      top: 60%;
      left: 8%;
      padding: 14px 26px;
      background: linear-gradient(135deg, #d4af37, #f5e6a3);
color: #111;
      font-weight: bold;
      text-decoration: none;
      font-size: 18px;
      border-radius: 6px;
      z-index: 10;
      white-space: nowrap;
    }

   .price-btn {
  position: absolute;
  top: 6%;
  right: 8%;

  padding: 12px 26px;

  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(6px);

  color: #111;

  font-weight: bold;
  font-size: 16px;

  border: 1.5px solid #e6d3a3;
  border-radius: 40px;

  cursor: pointer;

  z-index: 10;

  display: flex;
  align-items: center;
  gap: 10px;
}

    .price-box {
      display: none;

      position: absolute;
      top: 14%;
      right: 8%;

      width: 260px;

      background: rgba(0,0,0,0.92);

      color: #e6d3a3;

      border: 1px solid #c9b37a;
      border-radius: 8px;

      padding: 16px;

      line-height: 1.8;
      font-size: 15px;

      z-index: 20;
    }

    .languages {
      color: #e6d3a3;
      font-size: 18px;
      margin-top: 18px;
      text-align: center;
      letter-spacing: 1.5px;
    }

    .qr {
      position: absolute;
      bottom: 58px;
      right: 430px;
      width: 72px;
      height: 72px;
      background: white;
      padding: 3px;
      border-radius: 6px;
      border: 1.5px solid #c9b37a;
      z-index: 10;
    }

    @media screen and (max-width: 768px) {

      .btn {
        top: 60% !important;
        left: 12.5% !important;

        font-size: 6px !important;
        padding: 3px 6px !important;

        border-radius: 3px;
      }

      .price-btn {
        top: 6%;
        right: 6%;

        font-size: 10px;
        padding: 6px 12px;
      }

      .price-box {
        top: 13%;
        right: 6%;

        width: 170px;

        font-size: 10px;
        padding: 10px;

        line-height: 1.6;
      }

      .languages {
        font-size: 12px;
        margin-top: 12px;
        padding: 0 12px;
        letter-spacing: 1px;
      }

      .qr {
        width: 48px;
        height: 48px;
        bottom: 35px;
        right: 38%;
      }

    }

  </style>
</head>

<body>

  <div class="wrapper">

    <img src="newfalcon.png" class="bg">

    <a class="btn" href="https://api.whatsapp.com/send?phone=306981847324&text=Hello%2C%20I%20would%20like%20to%20book%20a%20transfer%20in%20Mykonos.%0A%0ANumber%20of%20passengers:%0ANumber%20of%20luggage:%0AFlight%20number:%0APick-up%20location:%0ADrop-off%20location:%0ADate:%0ATime:%0AChild%20seat%20needed:%0AAdditional%20notes:" target="_blank">
      Book via WhatsApp
    </a>

    <button class="price-btn" onclick="togglePrices()">
  Prices →
</button>

    <div id="prices" class="price-box">
      Airport → Mykonos Town — from €30<br>
      Airport → Paradise Beach — from €40<br>
      Airport → Elia Beach — from €50<br>
      Port → Hotel/Villa — upon request
    </div>

    <p class="languages">
      Service available in English, Greek, Ukrainian and Russian.
    </p>

  </div>

  <script>
    function togglePrices() {
      var box = document.getElementById("prices");

      if (box.style.display === "block") {
        box.style.display = "none";
      } else {
        box.style.display = "block";
      }
    }
  </script>

</body>
</html>
